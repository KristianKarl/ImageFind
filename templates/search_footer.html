</div>
<script>
    // Fullscreen preview for images/videos with navigation and rotation
    let currentImages = [];
    let currentImageIndex = 0;
    let currentRotation = 0;

    // Collect all image data for navigation
    function collectImageData() {
        currentImages = [];
        document.querySelectorAll('.thumbnail').forEach((thumbnail) => {
            const onClick = thumbnail.getAttribute('onclick');
            if (onClick) {
                const match = onClick.match(/openModal\('([^']+)',\s*'([^']*)'/);
                if (match) {
                    currentImages.push({
                        path: match[1],
                        description: match[2]
                    });
                }
            }
        });
    }

    function openFullscreenPreview(imagePath, description) {
        if (currentImages.length === 0) collectImageData();
        currentImageIndex = currentImages.findIndex(img => img.path === imagePath);
        if (currentImageIndex === -1) currentImageIndex = 0;
        currentRotation = 0;

        let isVideo = /\.(mp4|avi|mov|wmv|flv|webm|mkv|m4v|3gp|ogv)$/i.test(imagePath);
        let src = imagePath;
        if (isVideo && imagePath.startsWith('/image/')) {
            src = '/video' + imagePath.substring(7);
        }

        // Overlay
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.left = 0;
        overlay.style.top = 0;
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.background = 'rgba(0,0,0,0.97)';
        overlay.style.zIndex = 9999;
        overlay.style.display = 'flex';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.flexDirection = 'column';

        // Preview element
        let elem;
        if (isVideo) {
            elem = document.createElement('video');
            elem.src = src;
            elem.controls = true;
            elem.autoplay = true;
            elem.style.maxWidth = '100vw';
            elem.style.maxHeight = '100vh';
            elem.style.background = '#000';
        } else {
            elem = document.createElement('img');
            elem.src = imagePath;
            elem.alt = description || '';
            elem.style.maxWidth = '100vw';
            elem.style.maxHeight = '100vh';
            elem.style.width = '100vw'; // Upscale if necessary
            elem.style.height = '100vh';
            elem.style.objectFit = 'contain';
            elem.style.background = '#000';
            elem.style.transition = 'transform 0.3s';
        }
        overlay.appendChild(elem);

        // Description
        if (description) {
            const desc = document.createElement('div');
            desc.innerText = description;
            desc.style.color = '#eee';
            desc.style.marginTop = '20px';
            desc.style.fontSize = '1.1em';
            desc.style.maxWidth = '90vw';
            desc.style.textAlign = 'center';
            overlay.appendChild(desc);
        }

        // Close button
        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = '&times;';
        closeBtn.style.position = 'absolute';
        closeBtn.style.top = '30px';
        closeBtn.style.right = '40px';
        closeBtn.style.fontSize = '2.5em';
        closeBtn.style.background = 'rgba(0,0,0,0.5)';
        closeBtn.style.color = '#fff';
        closeBtn.style.border = 'none';
        closeBtn.style.borderRadius = '50%';
        closeBtn.style.width = '50px';
        closeBtn.style.height = '50px';
        closeBtn.style.cursor = 'pointer';
        closeBtn.style.zIndex = 10000;
        closeBtn.onclick = () => document.body.removeChild(overlay);
        overlay.appendChild(closeBtn);

        // Navigation arrows
        function navBtn(symbol, left, handler) {
            const btn = document.createElement('button');
            btn.innerHTML = symbol;
            btn.style.position = 'absolute';
            btn.style.top = '50%';
            btn.style.transform = 'translateY(-50%)';
            btn.style[left] = '30px';
            btn.style.fontSize = '2.5em';
            btn.style.background = 'rgba(0,0,0,0.5)';
            btn.style.color = '#fff';
            btn.style.border = 'none';
            btn.style.borderRadius = '50%';
            btn.style.width = '50px';
            btn.style.height = '50px';
            btn.style.cursor = 'pointer';
            btn.style.zIndex = 10000;
            btn.onclick = handler;
            return btn;
        }
        if (!isVideo && currentImages.length > 1) {
            if (currentImageIndex > 0) {
                overlay.appendChild(navBtn('&#8592;', 'left', () => showImageAt(currentImageIndex - 1, overlay)));
            }
            if (currentImageIndex < currentImages.length - 1) {
                overlay.appendChild(navBtn('&#8594;', 'right', () => showImageAt(currentImageIndex + 1, overlay)));
            }
        }

        // ESC to close
        function escListener(e) {
            if (e.key === 'Escape') {
                document.body.removeChild(overlay);
                document.removeEventListener('keydown', escListener);
            } else if (!isVideo && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
                if (e.key === 'ArrowLeft' && currentImageIndex > 0) {
                    showImageAt(currentImageIndex - 1, overlay);
                }
                if (e.key === 'ArrowRight' && currentImageIndex < currentImages.length - 1) {
                    showImageAt(currentImageIndex + 1, overlay);
                }
            } else if (!isVideo && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
                // Rotate image
                if (e.key === 'ArrowUp') {
                    currentRotation = (currentRotation + 90) % 360;
                } else if (e.key === 'ArrowDown') {
                    currentRotation = (currentRotation + 270) % 360;
                }
                elem.style.transform = `rotate(${currentRotation}deg)`;
            }
        }
        document.addEventListener('keydown', escListener);

        // Click outside to close
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                document.body.removeChild(overlay);
                document.removeEventListener('keydown', escListener);
            }
        });

        document.body.appendChild(overlay);
        if (overlay.requestFullscreen) overlay.requestFullscreen();

        // Helper to show another image in fullscreen
        function showImageAt(idx, oldOverlay) {
            document.removeEventListener('keydown', escListener);
            document.body.removeChild(oldOverlay);
            openFullscreenPreview(currentImages[idx].path, currentImages[idx].description);
        }
    }

    // Patch all thumbnails to use fullscreen preview
    document.addEventListener('DOMContentLoaded', function() {
        collectImageData();
        document.querySelectorAll('.thumbnail').forEach(function(img) {
            const origOnClick = img.getAttribute('onclick');
            if (origOnClick) {
                const match = origOnClick.match(/openModal\('([^']+)',\s*'([^']*)'/);
                if (match) {
                    img.onclick = function() {
                        openFullscreenPreview(match[1], match[2]);
                    };
                }
            }
        });
    });

    // Async thumbnail loading functionality
    async function loadThumbnails() {
        const resultItems = document.querySelectorAll('.result-item[data-file-path]');
        console.log(`Starting to load ${resultItems.length} thumbnails...`);
        
        // Limit concurrent requests to avoid overwhelming the server
        const maxConcurrent = 6;
        let currentRequests = 0;
        let completed = 0;
        
        function processNextThumbnail(index) {
            if (index >= resultItems.length) return;
            
            const item = resultItems[index];
            const filePath = item.getAttribute('data-file-path');
            const placeholder = item.querySelector('.thumbnail-placeholder');
            const thumbnail = item.querySelector('.thumbnail');
            
            currentRequests++;
            
            // Make request to thumbnail endpoint
            fetch(`/thumbnail/${filePath}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.thumbnail) {
                        // Thumbnail loaded successfully
                        thumbnail.src = `data:image/jpeg;base64,${data.thumbnail}`;
                        thumbnail.style.display = 'block';
                        placeholder.style.display = 'none';
                        
                        // Add hover effect
                        thumbnail.style.cursor = 'pointer';
                        thumbnail.style.transition = 'transform 0.2s ease, box-shadow 0.2s ease';
                    } else {
                        // No thumbnail available
                        placeholder.innerHTML = `
                            <div class="error-icon">📷</div>
                            <div style="font-size: 10px;">No Preview</div>
                        `;
                        placeholder.style.background = '#f8f9fa';
                        placeholder.style.color = '#6c757d';
                    }
                })
                .catch(error => {
                    console.error('Thumbnail loading failed:', filePath, error);
                    // Show error state
                    placeholder.innerHTML = `
                        <div class="error-icon">⚠️</div>
                        <div style="font-size: 10px;">Load Failed</div>
                    `;
                    placeholder.style.background = '#ffe6e6';
                    placeholder.style.color = '#cc0000';
                })
                .finally(() => {
                    currentRequests--;
                    completed++;
                    console.log(`Thumbnail ${completed}/${resultItems.length} completed: ${filePath}`);
                    
                    // Process next thumbnail if there are more and we have capacity
                    const nextIndex = index + maxConcurrent;
                    if (nextIndex < resultItems.length && currentRequests < maxConcurrent) {
                        processNextThumbnail(nextIndex);
                    }
                    
                    // If all requests are done, update modal navigation data
                    if (completed === resultItems.length) {
                        console.log('All thumbnails loaded, updating modal data...');
                        collectImageData();
                    }
                });
        }
        
        // Start initial batch of requests
        for (let i = 0; i < Math.min(maxConcurrent, resultItems.length); i++) {
            processNextThumbnail(i);
        }
    }
    
    // Collect image data when page loads and start thumbnail loading
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Page loaded, starting thumbnail loading...');
        loadThumbnails();
    });
</script>
</body>
</html>
