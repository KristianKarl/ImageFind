<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageFind Search Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .search-container { margin-bottom: 20px; }
        .search-input { padding: 10px; font-size: 16px; width: 300px; }
        .search-button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; cursor: pointer; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .result-item { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; }
        .thumbnail { max-width: 200px; max-height: 200px; border-radius: 4px; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .thumbnail:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); }
        .file-path { margin-top: 8px; font-size: 12px; color: #888; word-break: break-all; font-family: monospace; background: #f8f9fa; padding: 4px 8px; border-radius: 4px; }
        .value-text { margin-top: 10px; font-size: 12px; color: #666; word-wrap: break-word; text-align: left; max-height: 150px; overflow-y: auto; padding: 8px; background: #f9f9f9; border-radius: 4px; border: 1px solid #e9ecef; line-height: 1.4; }
        .no-thumbnail { width: 200px; height: 200px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; color: #999; }
        mark { background-color: lightgreen; padding: 1px 2px; border-radius: 2px; font-weight: 500; }
        .thumbnail-container { position: relative; width: 200px; height: 200px; }
        .thumbnail-placeholder { width: 200px; height: 200px; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #999; border-radius: 4px; position: absolute; top: 0; left: 0; }
        .loading-spinner { width: 24px; height: 24px; border: 3px solid #e0e0e0; border-top: 3px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 8px; }
        .loading-text { font-size: 12px; font-weight: 500; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .thumbnail-error { width: 200px; height: 200px; background: #ffe6e6; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #cc0000; border-radius: 4px; border: 1px solid #ffcccc; }
        .error-icon { font-size: 24px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="search-container">
        <form method="GET" action="/search">
            <input type="text" name="search" class="search-input" placeholder="Search images..." value="" />
            <button type="submit" class="search-button">Search</button>
        </form>
    </div>
    <div class="results-grid">
